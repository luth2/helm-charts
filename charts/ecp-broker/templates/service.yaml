{{- range $instance := .Values.instance }}
{{- $name := include "ecp-broker.instanceName" (dict "root" $ "instance" $instance) -}}
{{- if or (not (hasKey $instance "enabled")) $instance.enabled }}
{{- $service := $instance.service | default dict -}}
{{- $amqp := "amqps" -}}
{{- $ports := pick $service "http" "https" -}}
{{- $_ := set $ports $amqp (mergeOverwrite (dict "port" 5671) (deepCopy (get $service $amqp | default dict))) -}}
{{- range $headless := list false true }}
{{- $type := ternary "ClusterIP" (default "ClusterIP" $service.type) $headless }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ ternary "headless-svc" "svc" $headless }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  {{- with $service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $type }}
  {{- if $headless }}
  clusterIP: None
  publishNotReadyAddresses: true
  {{- else if and (eq $type "LoadBalancer") $service.loadBalancerIP }}
  loadBalancerIP: {{ $service.loadBalancerIP | quote }}
  {{- end }}
  selector:
    app: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  ports:
    {{- range $port, $settings := $ports }}
    - name: {{ $port }}
      port: {{ $settings.port }}
      targetPort: {{ $port }}
      protocol: TCP
      {{- if and (not $headless) (has $type (list "NodePort" "LoadBalancer")) $settings.nodePort }}
      nodePort: {{ $settings.nodePort }}
      {{- end }}
    {{- end }}
    {{- if $headless }}
    - name: ha
      port: {{ dig "brokerXml" "highAvailability" "acceptor" "port" 61616 $instance }}
      targetPort: ha
      protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
{{- end }}