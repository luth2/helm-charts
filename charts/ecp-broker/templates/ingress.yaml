{{- range $instance := .Values.instance }}
{{- $name := include "ecp-broker.instanceName" (dict "root" $ "instance" $instance) -}}
{{- if and (or (not (hasKey $instance "enabled")) $instance.enabled) (dig "ingress" "enabled" false $instance) }}
{{- $ingress := $instance.ingress -}}
{{- $https := hasKey $instance.service "https" -}}
{{- $annotations := deepCopy ($ingress.annotations | default dict) -}}
{{- if and $https (eq (default "" $ingress.ingressClassName) "nginx") (not (hasKey $annotations "nginx.ingress.kubernetes.io/backend-protocol")) -}}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS" -}}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-ingress
  labels:
    app: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  {{- with $annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $ingress.tls }}
  tls:
    - hosts: [{{ $ingress.host | quote }}]
      secretName: {{ required "ingress.tls.secretName is required" .secretName | quote }}
  {{- end }}
  rules:
    - host: {{ $ingress.host | quote }}
      http:
        paths:
          - path: {{ default "/" $ingress.contextPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-svc
                port:
                  name: {{ ternary "https" "http" $https }}
{{- end }}
{{- end }}