{{- range $instance := .Values.instance }}
{{- $ctx := dict "root" $ "instance" $instance -}}
{{- $name := include "ecp-directory.instanceName" $ctx -}}
{{- if or (not (hasKey $instance "enabled")) $instance.enabled }}
{{- $props := $instance.ecpDirectoryProperties | default dict -}}
{{- $sc := mergeOverwrite (dict "runAsUser" 2000 "runAsGroup" 2000 "fsGroup" 2000 "fsGroupChangePolicy" "OnRootMismatch") (deepCopy ($instance.securityContext | default dict)) -}}
{{- $mainSecurity := dict "runAsUser" $sc.runAsUser "runAsGroup" $sc.runAsGroup "runAsNonRoot" true "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL")) "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- $rootSecurity := dict "runAsUser" 0 "runAsGroup" 0 "runAsNonRoot" false "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL") "add" (list "CHOWN" "FOWNER" "DAC_OVERRIDE")) "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- $labels := mergeOverwrite (deepCopy (dig "template" "labels" (dict) $instance)) (dict "app" $name "app.kubernetes.io/instance" $.Release.Name) -}}
{{- $annotations := deepCopy (dig "template" "annotations" (dict) $instance) -}}
{{- $_ := set $annotations "existing-secret-revision" (default "" $instance.secretRevision) -}}
{{- if dig "checksumConfig" true $instance -}}{{- $_ := set $annotations "checksum/config" (include "ecp-directory.publicConfig" $ctx | sha256sum) -}}{{- end -}}
{{- $files := dict "ecp-directory.properties" "/etc/ecp-directory/ecp-directory.properties" "ecp-users.properties" "/etc/ecp-directory/ecp-users.properties" "ecp-password.properties" "/etc/ecp-directory/ecp-password.properties" "ecp-logback.xml" "/etc/ecp-directory/ecp-logback.xml" "server.xml" "/usr/share/ecp-directory/conf/server.xml" "env.conf" "/etc/systemd/system/ecp-directory.service.d/env.conf" "setenv.sh" "/usr/share/ecp-directory/bin/setenv.sh" -}}
{{- $secretKeys := list "ecp-directory.properties" "ecp-users.properties" "ecp-password.properties" "server.xml" -}}
{{- if $instance.sessionReplication -}}{{- $_ := set $files "context.xml" "/usr/share/ecp-directory/conf/context.xml" -}}{{- end -}}
{{- with $instance.jmxRemoteProperties -}}
{{- $_ := set $files "jmxremote.properties" "/etc/ecp-directory/jmxremote.properties" -}}
{{- $_ := set $files "jmxremote.access" (default "/etc/ecp-directory/jmxremote.access" .comSunManagementJmxRemoteAccessFile) -}}
{{- $_ := set $files "jmxremote.password" (default "/etc/ecp-directory/jmxremote.password" .comSunManagementJmxRemotePasswordFile) -}}
{{- $_ := set $files "jmxremote.ssl" (default "/etc/ecp-directory/jmxremote.ssl" .comSunManagementJmxRemoteSslConfigFile) -}}
{{- $secretKeys = concat $secretKeys (list "jmxremote.password" "jmxremote.ssl") -}}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
spec:
  serviceName: {{ $name }}-headless-svc
  replicas: {{ dig "replicaCount" 1 $instance }}
  selector:
    matchLabels:
      app: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  template:
    metadata:
      labels: {{ toYaml $labels | nindent 8 }}
      annotations: {{ toYaml $annotations | nindent 8 }}
    spec:
      {{- with (dig "global" "imagePullSecrets" (list) (merge (dict) $.Values)) }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $instance.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $instance.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $instance.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{ $sc.fsGroup }}
        fsGroupChangePolicy: {{ $sc.fsGroupChangePolicy }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Root is limited to copying image seed data and repairing PVC ownership.
        # No projected configuration is mounted into either root init container.
        - name: seed-data
          image: {{ include "ecp-directory.image" $instance.image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $instance.image.pullPolicy }}
          securityContext: {{ toYaml $rootSecurity | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              cp -Rn /var/lib/ecp-directory/. /seed/
          volumeMounts:
            - name: data
              mountPath: /seed
        - name: volume-permissions
          image: {{ include "ecp-directory.busybox" $ | quote }}
          securityContext: {{ toYaml $rootSecurity | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          env:
            - name: APP_OWNER
              value: {{ printf "%v:%v" $sc.runAsUser $sc.runAsGroup | quote }}
          args:
            - |
              set -eu
              chown -R "$APP_OWNER" /data
              chmod -R u+rwX,g+rX,o-rwx /data
              {{- if $instance.keepLogsAfterRestart }}
              chown -R "$APP_OWNER" /logs
              chmod -R u+rwX,g+rX,o-rwx /logs
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if $instance.keepLogsAfterRestart }}
            - name: logs
              mountPath: /logs
            {{- end }}
        {{- if dig "databaseWait" "enabled" false $instance }}
        - name: wait-for-database
          image: {{ include "ecp-directory.busybox" $ | quote }}
          securityContext: {{ toYaml $mainSecurity | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          env:
            - name: DB_HOST
              value: {{ $instance.databaseWait.host | quote }}
            - name: DB_PORT
              value: {{ $instance.databaseWait.port | quote }}
            - name: DB_ATTEMPTS
              value: {{ default 30 $instance.databaseWait.attempts | quote }}
            - name: DB_INTERVAL
              value: {{ default 2 $instance.databaseWait.intervalSeconds | quote }}
          args:
            - |
              attempt=0
              while [ "$attempt" -lt "$DB_ATTEMPTS" ]; do
                nc -z -w 2 "$DB_HOST" "$DB_PORT" && exit 0
                attempt=$((attempt + 1))
                sleep "$DB_INTERVAL"
              done
              exit 1
        {{- end }}
        {{- range $extra := $instance.initContainers }}
        {{- $extra = deepCopy $extra }}
        {{- $_ := set $extra "securityContext" $mainSecurity }}
        - {{ toYaml $extra | nindent 10 }}
        {{- end }}
      containers:
        - name: ecp-directory
          image: {{ include "ecp-directory.image" $instance.image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $instance.image.pullPolicy }}
          securityContext: {{ toYaml $mainSecurity | nindent 12 }}
          {{- with $instance.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $instance.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- include "ecp-directory.probes" (dict "instance" $instance "port" (ternary "https" "http" (hasKey $instance.service "https"))) | nindent 10 }}
          ports:
            {{- range $port := list "http" "https" }}
            {{- with get $instance.service $port }}
            - name: {{ $port }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
            {{- end }}
          {{- if or $instance.env $instance.sessionReplication }}
          env:
            {{- if $instance.sessionReplication }}
            - name: DNS_MEMBERSHIP_SERVICE_NAME
              value: {{ $name }}-headless-svc
            {{- end }}
            {{- with $instance.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            {{- range $file, $path := $files }}
            - name: config
              subPath: {{ $file }}
              mountPath: {{ $path | quote }}
              readOnly: true
            {{- end }}
            - name: data
              mountPath: {{ default "/var/lib/ecp-directory" $props.dataDirectory | quote }}
            {{- if $instance.keepLogsAfterRestart }}
            - name: logs
              mountPath: {{ default "/var/log/ecp-directory" $props.loggingFilePath | quote }}
            {{- end }}
            {{- with $instance.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $instance.resourcesK8s }}
          {{- $resources := deepCopy . }}
          {{- if hasKey ($resources.requests | default dict) "ephemeralStorage" }}
          {{- $_ := set $resources.requests "ephemeral-storage" $resources.requests.ephemeralStorage }}
          {{- $_ := unset $resources.requests "ephemeralStorage" }}
          {{- end }}
          resources: {{ toYaml $resources | nindent 12 }}
          {{- end }}
        {{- with $instance.containers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: {{ $name }}-cm
              - secret:
                  name: {{ $instance.existingSecret | quote }}
                  items:
                    {{- range $key := $secretKeys }}
                    - key: {{ $key }}
                      path: {{ $key }}
                    {{- end }}
        {{- with $instance.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
    {{- include "ecp-directory.claim" (dict "root" $ "name" "data" "size" (default "1Gi" $instance.storageData)) | nindent 4 }}
    {{- if $instance.keepLogsAfterRestart }}
    {{- include "ecp-directory.claim" (dict "root" $ "name" "logs" "size" (default "256Mi" $instance.storageLogs)) | nindent 4 }}
    {{- end }}
    {{- $claimNames := dict "data" true "config" true "logs" true }}
    {{- range $claim := $instance.volumeClaimTemplates }}
    {{- if hasKey $claimNames $claim.metadata.name }}{{ fail "duplicate/reserved volumeClaimTemplates name" }}{{- end }}
    {{- $_ := set $claimNames $claim.metadata.name true }}
    - {{ toYaml $claim | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}