# ECP Component Directory, Chart 5.0.0. Helm ersetzt die gesamte Instanzliste.
# Private Vollkonfigurationen ausschliesslich im vorhandenen Secret, siehe README.md.
instance:
- name: cd
  enabled: true
  existingSecret: '' # Absichtlich leer: Standalone-Lint/Render muss so fehlschlagen.
  secretRevision: '1' # Bei jeder externen Secret-Aenderung erhoehen.
  checksumConfig: true # Nur oeffentliche ConfigMap-Inhalte.
  image:
    name: entsoe/ecp-directory
    tag: '4.17.0'
    pullPolicy: IfNotPresent
  replicaCount: 1
  sessionReplication: true # Cluster-Konfiguration auch im externen server.xml pflegen.
  securityContext:
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
  resourcesK8s:
    requests:
      cpu: 1000m
      ephemeralStorage: 256Mi
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  storageData: 1Gi
  storageLogs: 256Mi
  keepLogsAfterRestart: true
  # TCP-Erreichbarkeit, keine DB-, TLS- oder fachliche Gesundheitspruefung.
  startupProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 60
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  service:
    type: ClusterIP
    https:
      port: 8443 # Externes server.xml muss denselben Listener konfigurieren.
    annotations: {}
  ingress:
    enabled: false
  ecpDirectoryProperties:
    # Abgleich mit externer ecp-directory.properties, keine Vollfile-Erzeugung.
    # Profil dient der HA-Validierung; Logging-Profil auch extern setzen.
    springProfilesActive: 'ecp-nonha, console-logging'
    dataDirectory: /var/lib/ecp-directory # Tatsaechlicher PVC-Mountpfad.
    loggingFilePath: /var/log/ecp-directory # Tatsaechlicher Logs-Mountpfad.
    loggingFileName: /var/log/ecp-directory/ecp.log
    loggingConfig: /etc/ecp-directory/ecp-logback.xml
  envConf:
    resourcesJvm:
      xms: 64M
      xmx: 768M
    ecpLogFullStackTrace: false

# '' laesst storageClassName weg (Cluster-Default); '-' setzt explizit ''.
global:
  storage:
    class: ''
  imagePullSecrets: []
  imageBusybox:
    name: busybox
    tag: '1.37.0'
