# ECP Endpoint, Chart 5.0.0. Helm ersetzt die gesamte Instanzliste.
# Private Vollkonfigurationen ausschliesslich im vorhandenen Secret, siehe README.md.
instance:
- name: ep1
  enabled: true
  existingSecret: '' # Absichtlich leer: Standalone-Lint/Render muss so fehlschlagen.
  secretRevision: '1' # Bei jeder externen Secret-Aenderung erhoehen.
  checksumConfig: true # Nur oeffentliche ConfigMap-Inhalte.
  image:
    name: entsoe/ecp-endpoint
    tag: '4.17.1'
    pullPolicy: IfNotPresent
  replicaCount: 1
  sessionReplication: false
  securityContext:
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
  resourcesK8s:
    requests:
      cpu: 500m
      ephemeralStorage: 256Mi
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1512Mi
  storageData: 1Gi
  storageLogs: 256Mi
  keepLogsAfterRestart: true
  # TCP-Erreichbarkeit, keine DB-, TLS- oder fachliche Gesundheitspruefung.
  # Probe-Aktionen und Timing-Defaults kommen aus dem StatefulSet-Template-Helper.
  startupProbe:
    enabled: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: false
  # Optionaler TCP-Check vor dem Anwendungsstart; keine DB-Anmeldung oder Schema-Pruefung.
  databaseWait:
    enabled: false
    # host: db.example.invalid
    # port: 5432
    # attempts: 30
    # intervalSeconds: 2
  service:
    type: ClusterIP
    https:
      port: 8443 # Externes server.xml muss denselben Listener konfigurieren.
    annotations: {}
  ingress:
    enabled: false
  gateway:
    # Vorhandenes Gateway, ein parentRef (MVP); siehe README.md und Dokumentation/Helm_Charts.md.
    enabled: false
  ecpProperties:
    # Nur diese oeffentlichen Werte werden vom Chart ausgewertet.
    # Alle Laufzeit-Properties einschliesslich DB-Credentials gehoeren in die
    # vollstaendige ecp.properties im bestehenden Secret, nicht in diese Values.
    # Profil dient der HA-Validierung; Logging-Profil auch extern setzen.
    springProfilesActive: 'ecp-nonha, console-logging'
    dataDirectory: /var/lib/ecp-endpoint # Tatsaechlicher PVC-Mountpfad.
    loggingFilePath: /var/log/ecp-endpoint # Tatsaechlicher Logs-Mountpfad.
    loggingFileName: /var/log/ecp-endpoint/ecp.log
    loggingConfig: /etc/ecp-endpoint/ecp-logback.xml
    internalBrokerAuthUser: endpoint # Oeffentliche groups.properties, kein Benutzerkonto.
    # Nur bei replicaCount > 1: DB-Treiber und URL fuer die HA-Validierung.
    # Die DB-Verbindung selbst kommt weiterhin aus der externen ecp.properties.
    # springDatasourceDriverClassName: org.postgresql.Driver
    # ecpDBUrl: jdbc:postgresql://db.example.invalid:5432/ecp
  envConf:
    resourcesJvm:
      xms: 128M
      xmx: 1G
    ecpLogFullStackTrace: false

# '' laesst storageClassName weg (Cluster-Default); '-' setzt explizit ''.
global:
  storage:
    class: ''
  imagePullSecrets: []
  imageBusybox:
    name: busybox
    tag: '1.37.0'
