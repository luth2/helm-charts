# ECCoSP Artemis, Chart 5.0.0. Helm ersetzt die gesamte Instanzliste.
# Private Vollkonfigurationen ausschliesslich im vorhandenen Secret, siehe README.md.
instance:
- name: artemis-eptb1
  enabled: true
  existingSecret: '' # Absichtlich leer: Standalone-Lint/Render muss so fehlschlagen.
  secretRevision: '1' # Bei Secret-Aenderung erhoehen; HA braucht manuellen Neustart.
  checksumConfig: true # Nur oeffentliche ConfigMap-Inhalte.
  prometheusEnabled: false # Ergaenzt Metrics-Plugin und metrics.war in Kopien der Secret-XMLs.
  image:
    name: entsoe/eccosp-artemis
    tag: '4.17.1'
    pullPolicy: IfNotPresent
  replicaCount: 1
  securityContext:
    runAsUser: 2030
    runAsGroup: 2030
    fsGroup: 2030
    fsGroupChangePolicy: OnRootMismatch
  resourcesK8s:
    requests:
      cpu: 500m
      ephemeralStorage: 256Mi
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 5Gi
  storageData: 1Gi
  storageLogs: 256Mi
  keepLogsAfterRestart: false
  useSharedStorageForConfiguration: false # Bei HA zwingend false.
  useSharedStorageForJournal: false # Bei HA zwingend true.
  sharedStorageClass: '' # Bei Aktivierung explizit eine geeignete Klasse setzen.
  sharedStorageClassJournal: '' # HA verlangt eine explizite, geeignete RWX-Klasse.
  sharedStorageSize: 1Gi
  sharedStorageSizeJournal: 1Gi
  sharedStorageAccessMode: ReadWriteMany
  # Single: TCP. HA: Startup/Liveness pruefen nur PID 1; Readiness bleibt TCP.
  # Probe-Aktionen und Timing-Defaults kommen aus dem StatefulSet-Template-Helper.
  startupProbe:
    enabled: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: false
  service:
    type: ClusterIP
    https:
      port: 8161 # Listener/TLS im externen bootstrap.xml konfigurieren.
    amqps:
      port: 5672 # Listener/TLS im externen Broker-XML konfigurieren.
    annotations: {}
  ingress:
    enabled: false
  gateway:
    # Vorhandenes Gateway, ein parentRef (MVP); siehe README.md und Dokumentation/Helm_Charts.md.
    enabled: false
  brokerXml:
    highAvailability:
      acceptor:
        port: 61616 # Pod/Headless-Service-Port; aendert kein externes XML.
  artemisUsers:
  - login: endpoint # Nur amq-Rollenmapping; Zugangsdaten extern bereitstellen.
  - login: toolbox
  env:
    resourcesJvm:
      xms: 128M
      xmx: 4G

# '' laesst storageClassName weg (Cluster-Default); '-' setzt explizit ''.
global:
  storage:
    class: ''
  imagePullSecrets: []
  imageBusybox:
    name: busybox
    tag: '1.37.0'
  imageMetricsPython:
    name: python
    tag: '3.12-alpine'
