{{- range $instance := .Values.instance }}
{{- $ctx := dict "root" $ "instance" $instance -}}
{{- $name := include "eccosp-artemis.instanceName" $ctx -}}
{{- if or (not (hasKey $instance "enabled")) $instance.enabled }}
{{- $ha := gt (int (dig "replicaCount" 1 $instance)) 1 -}}
{{- $service := $instance.service | default dict -}}
{{- if and $instance.prometheusEnabled (not (or $service.http $service.https)) }}{{ fail "eccosp-artemis: prometheusEnabled requires an HTTP or HTTPS service and bootstrap.xml" }}{{- end -}}
{{- $amqp := "amqps" -}}
{{- $amqpPort := dig $amqp "port" 5672 $service -}}
{{- $sc := mergeOverwrite (dict "runAsUser" 2030 "runAsGroup" 2030 "fsGroup" 2030 "fsGroupChangePolicy" "OnRootMismatch") (deepCopy ($instance.securityContext | default dict)) -}}
{{- $mainSecurity := dict "runAsUser" $sc.runAsUser "runAsGroup" $sc.runAsGroup "runAsNonRoot" true "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL")) "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- $rootSecurity := dict "runAsUser" 0 "runAsGroup" 0 "runAsNonRoot" false "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL") "add" (list "CHOWN" "FOWNER" "DAC_OVERRIDE")) "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- $labels := mergeOverwrite (deepCopy (dig "template" "labels" (dict) $instance)) (dict "app" $name "app.kubernetes.io/instance" $.Release.Name) -}}
{{- $annotations := deepCopy (dig "template" "annotations" (dict) $instance) -}}
{{- $_ := set $annotations "existing-secret-revision" (default "" $instance.secretRevision) -}}
{{- if dig "checksumConfig" true $instance -}}{{- $_ := set $annotations "checksum/config" (include "eccosp-artemis.publicConfig" $ctx | sha256sum) -}}{{- end -}}
{{- $files := dict "artemis-users.properties" "/opt/eccosp-artemis/etc/artemis-users.properties" "artemis-roles.properties" "/opt/eccosp-artemis/etc/artemis-roles.properties" "artemis.profile" "/opt/eccosp-artemis/etc/artemis.profile" "log4j2.properties" "/opt/eccosp-artemis/etc/log4j2.properties" "jolokia-access.xml" "/opt/eccosp-artemis/etc/jolokia-access.xml" -}}
{{- $secretKeys := list "artemis-users.properties" -}}
{{- if or $service.http $service.https -}}
{{- $_ := set $files "bootstrap.xml" "/opt/eccosp-artemis/etc/bootstrap.xml" -}}
{{- $secretKeys = append $secretKeys "bootstrap.xml" -}}
{{- end -}}
{{- if $ha -}}
{{- $secretKeys = concat $secretKeys (list "broker-master.xml" "broker-slave.xml") -}}
{{- else -}}
{{- $_ := set $files "broker.xml" "/opt/eccosp-artemis/etc/broker.xml" -}}
{{- $secretKeys = append $secretKeys "broker.xml" -}}
{{- end -}}
{{- if $instance.prometheusEnabled -}}
{{- $_ := unset $files "broker.xml" -}}
{{- $_ := unset $files "bootstrap.xml" -}}
{{- end -}}
{{- $mounts := dict "data" "/opt/eccosp-artemis/etc" "journal" "/opt/eccosp-artemis/data" "logs" "/opt/eccosp-artemis/log" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
spec:
  serviceName: {{ $name }}-headless-svc
  replicas: {{ dig "replicaCount" 1 $instance }}
  {{- if $ha }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  template:
    metadata:
      labels: {{ toYaml $labels | nindent 8 }}
      annotations: {{ toYaml $annotations | nindent 8 }}
    spec:
      {{- with (dig "global" "imagePullSecrets" (list) (merge (dict) $.Values)) }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $instance.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $instance.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $instance.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{ $sc.fsGroup }}
        fsGroupChangePolicy: {{ $sc.fsGroupChangePolicy }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Root is needed only for seed copy and PVC ownership, never for /config.
        - name: seed-data
          image: {{ include "eccosp-artemis.image" $instance.image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $instance.image.pullPolicy }}
          securityContext: {{ toYaml $rootSecurity | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              cp -Rn /opt/eccosp-artemis/etc/. /seed-data/
          volumeMounts:
            - name: data
              mountPath: /seed-data
        - name: volume-permissions
          image: {{ include "eccosp-artemis.busybox" $ | quote }}
          securityContext: {{ toYaml $rootSecurity | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          env:
            - name: APP_OWNER
              value: {{ printf "%v:%v" $sc.runAsUser $sc.runAsGroup | quote }}
          args:
            - |
              set -eu
              for dir in /data /logs; do
                chown -R "$APP_OWNER" "$dir"
                chmod -R u+rwX,g+rX,o-rwx "$dir"
              done
              # Do not traverse another replica's active shared journal.
              chown "$APP_OWNER" /journal
              chmod u+rwX,g+rX,o-rwx /journal
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: journal
              mountPath: /journal
        {{- if $ha }}
        - name: artemis-ha-configuration-update
          image: {{ include "eccosp-artemis.busybox" $ | quote }}
          securityContext: {{ toYaml $mainSecurity | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args: ["umask 027; /bin/sh /config/configure-cluster.sh"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- range $file := list "broker-master.xml" "broker-slave.xml" }}
            - name: config
              subPath: {{ $file }}
              mountPath: /tmp/{{ $file }}
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /opt/eccosp-artemis/etc
        {{- end }}
        {{- if $instance.prometheusEnabled }}
        - name: configure-prometheus-metrics
          image: {{ include "eccosp-artemis.image" $.Values.global.imageMetricsPython | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $.Values.global.imageMetricsPython.pullPolicy }}
          securityContext: {{ toYaml $mainSecurity | nindent 12 }}
          command: ["python3", "/config/metrics_transform.py"]
          args:
            - {{ ternary "/opt/eccosp-artemis/etc/broker.xml" "/config/broker.xml" $ha | quote }}
            - /config/bootstrap.xml
            - /opt/eccosp-artemis/etc/broker.xml
            - /opt/eccosp-artemis/etc/bootstrap.xml
            - com.redhat.amq.broker.core.server.metrics.plugins.ArtemisPrometheusMetricsPlugin
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- range $key := ternary (list "bootstrap.xml") (list "broker.xml" "bootstrap.xml") $ha }}
            - name: config
              subPath: {{ $key }}
              mountPath: /tmp/{{ $key }}
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /opt/eccosp-artemis/etc
        {{- end }}
        {{- range $extra := $instance.initContainers }}
        {{- $extra = deepCopy $extra }}
        {{- $_ := set $extra "securityContext" $mainSecurity }}
        - {{ toYaml $extra | nindent 10 }}
        {{- end }}
      containers:
        - name: eccosp-artemis
          image: {{ include "eccosp-artemis.image" $instance.image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $instance.image.pullPolicy }}
          securityContext: {{ toYaml $mainSecurity | nindent 12 }}
          {{- with $instance.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $instance.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- include "eccosp-artemis.probes" (dict "instance" $instance "port" $amqp "ha" $ha) | nindent 10 }}
          ports:
            - name: {{ $amqp }}
              containerPort: {{ $amqpPort }}
            - name: ha
              containerPort: {{ dig "brokerXml" "highAvailability" "acceptor" "port" 61616 $instance }}
            {{- range $port := list "http" "https" }}
            {{- with get $service $port }}
            - name: {{ $port }}
              containerPort: {{ .port }}
            {{- end }}
            {{- end }}
          {{- with $instance.extraEnv }}
          env: {{ toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- range $file, $path := $files }}
            - name: config
              subPath: {{ $file }}
              mountPath: {{ $path | quote }}
              readOnly: true
            {{- end }}
            {{- range $volume, $path := $mounts }}
            - name: {{ $volume }}
              mountPath: {{ $path | quote }}
            {{- end }}
            {{- with $instance.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $instance.resourcesK8s }}
          {{- $resources := deepCopy . }}
          {{- if hasKey ($resources.requests | default dict) "ephemeralStorage" }}
          {{- $_ := set $resources.requests "ephemeral-storage" $resources.requests.ephemeralStorage }}
          {{- $_ := unset $resources.requests "ephemeralStorage" }}
          {{- end }}
          resources: {{ toYaml $resources | nindent 12 }}
          {{- end }}
        {{- with $instance.containers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: {{ $name }}-cm
              - secret:
                  name: {{ $instance.existingSecret | quote }}
                  items:
                    {{- range $key := $secretKeys }}
                    - key: {{ $key }}
                      path: {{ $key }}
                    {{- end }}
        {{- if not $instance.keepLogsAfterRestart }}
        - name: logs
          emptyDir: {}
        {{- end }}
        {{- if $instance.useSharedStorageForConfiguration }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-config-claim
        {{- end }}
        {{- if $instance.useSharedStorageForJournal }}
        - name: journal
          persistentVolumeClaim:
            claimName: {{ $name }}-journal-claim
        {{- end }}
        {{- with $instance.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
    {{- if not $instance.useSharedStorageForConfiguration }}
    {{- include "eccosp-artemis.claim" (dict "root" $ "name" "data" "size" (default "1Gi" $instance.storageData)) | nindent 4 }}
    {{- end }}
    {{- if not $instance.useSharedStorageForJournal }}
    {{- include "eccosp-artemis.claim" (dict "root" $ "name" "journal" "size" (default "1Gi" $instance.storageData)) | nindent 4 }}
    {{- end }}
    {{- if $instance.keepLogsAfterRestart }}
    {{- include "eccosp-artemis.claim" (dict "root" $ "name" "logs" "size" (default "256Mi" $instance.storageLogs)) | nindent 4 }}
    {{- end }}
    {{- $claimNames := dict "data" true "config" true "journal" true "logs" true }}
    {{- range $claim := $instance.volumeClaimTemplates }}
    {{- if hasKey $claimNames $claim.metadata.name }}{{ fail "duplicate/reserved volumeClaimTemplates name" }}{{- end }}
    {{- $_ := set $claimNames $claim.metadata.name true }}
    - {{ toYaml $claim | nindent 6 }}
    {{- end }}
{{- range $kind := list "config" "journal" }}
{{- $enabled := ternary $instance.useSharedStorageForJournal $instance.useSharedStorageForConfiguration (eq $kind "journal") }}
{{- if $enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-{{ $kind }}-claim
  labels:
    app: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
spec:
  storageClassName: {{ ternary $instance.sharedStorageClassJournal $instance.sharedStorageClass (eq $kind "journal") | quote }}
  accessModes: [{{ default "ReadWriteMany" $instance.sharedStorageAccessMode | quote }}]
  resources:
    requests:
      storage: {{ default "100Mi" (ternary $instance.sharedStorageSizeJournal $instance.sharedStorageSize (eq $kind "journal")) | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}