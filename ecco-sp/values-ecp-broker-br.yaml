# Umbrella-Beispiel: nur Broker aktiv; andere Komponenten bleiben in values.yaml aus.
# Vollstaendige Instanzliste aus charts/ecp-broker/values.yaml, keine Secret-Inhalte.
# Secret vor Installation extern befuellen; Ports, TLS, Benutzer und Registrierung abstimmen.
# Directory-URL bei Release platform: https://platform-ecp-directory-cd-svc:8443/ECP_MODULE.
# Diese URL nur in der externen Vollkonfiguration pflegen, nicht als brokerProperties-Value.
ecp-broker:
  enabled: true
  instance:
  - name: br
    enabled: true
    existingSecret: ecp-broker-br-config
    secretRevision: '1'
    checksumConfig: true
    image:
      name: entsoe/ecp-broker
      tag: '4.17.0'
      pullPolicy: IfNotPresent
    replicaCount: 1
    securityContext:
      runAsUser: 2000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
    resourcesK8s:
      requests:
        cpu: 500m
        ephemeralStorage: 256Mi
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 5Gi
    storageData: 1Gi
    storageLogs: 256Mi
    storageLogsSize: 64Mi
    keepLogsAfterRestart: false
    useSharedStorageForConfiguration: false
    useSharedStorageForJournal: false
    sharedStorageClass: ''
    sharedStorageClassJournal: ''
    sharedStorageSize: 1Gi
    sharedStorageSizeJournal: 1Gi
    sharedStorageAccessMode: ReadWriteMany
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 60
      successThreshold: 1
    readinessProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    livenessProbe:
      enabled: false
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    service:
      type: ClusterIP
      https:
        port: 8161
      amqps:
        port: 5671
      annotations: {}
    ingress:
      enabled: false
    brokerXml:
      highAvailability:
        acceptor:
          port: 61616 # Pod/Headless-Port; aendert keine externe Vollkonfiguration.
    artemisUsers:
    - login: admin # Nur oeffentliches amq-Rollenmapping, Passwort extern.
    env:
      resourcesJvm:
        xms: 128M
        xmx: 4G
