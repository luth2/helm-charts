# Umbrella-Beispiel: nur Endpoint aktiv; andere Komponenten bleiben in values.yaml aus.
# Vollstaendige Instanzliste aus charts/ecp-endpoint/values.yaml. JMX bleibt aus.
# Secret vor Installation extern befuellen; Ports, DB, TLS und Benutzer dort abstimmen.
# EP2 -> platform-eccosp-artemis-artemis-eptb2-svc:5672 nur extern konfigurieren.
# Nicht mit EP1 per -f stapeln: Helm ersetzt instance-Listen statt sie anzufuegen.
ecp-endpoint:
  enabled: true
  instance:
  - name: ep2
    enabled: true
    existingSecret: ecp-endpoint-ep2-config
    secretRevision: '1'
    checksumConfig: true
    image:
      name: entsoe/ecp-endpoint
      tag: '4.17.0'
      pullPolicy: IfNotPresent
    replicaCount: 1
    sessionReplication: false
    securityContext:
      runAsUser: 2000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
    resourcesK8s:
      requests:
        cpu: 500m
        ephemeralStorage: 256Mi
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 1512Mi
    storageData: 1Gi
    storageLogs: 256Mi
    keepLogsAfterRestart: true
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 60
      successThreshold: 1
    readinessProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    livenessProbe:
      enabled: false
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    service:
      type: ClusterIP
      https:
        port: 8443
      annotations: {}
    ingress:
      enabled: false
    ecpProperties:
      # Pfade/Profile auch extern setzen; Values ersetzen keine Vollkonfiguration.
      springProfilesActive: 'ecp-nonha, console-logging'
      dataDirectory: /var/lib/ecp-endpoint
      loggingFilePath: /var/log/ecp-endpoint
      loggingFileName: /var/log/ecp-endpoint/ecp.log
      loggingConfig: /etc/ecp-endpoint/ecp-logback.xml
      internalBrokerAuthUser: endpoint # Nur oeffentliches Gruppenmapping.
    envConf:
      resourcesJvm:
        xms: 128M
        xmx: 1G
      ecpLogFullStackTrace: false
