# Umbrella-Beispiel: nur Directory aktiv; andere Komponenten bleiben in values.yaml aus.
# Vollstaendige Instanzliste aus charts/ecp-directory/values.yaml, keine Secret-Inhalte.
# Secret vor Installation extern befuellen; Ports, DB, TLS und Benutzer dort abstimmen.
ecp-directory:
  enabled: true
  instance:
  - name: cd
    enabled: true
    existingSecret: ecp-directory-cd-config
    secretRevision: '1'
    checksumConfig: true
    image:
      name: entsoe/ecp-directory
      tag: '4.17.0'
      pullPolicy: IfNotPresent
    replicaCount: 1
    sessionReplication: true
    securityContext:
      runAsUser: 2000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
    resourcesK8s:
      requests:
        cpu: 1000m
        ephemeralStorage: 256Mi
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    storageData: 1Gi
    storageLogs: 256Mi
    keepLogsAfterRestart: true
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 60
      successThreshold: 1
    readinessProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    livenessProbe:
      enabled: false
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    service:
      type: ClusterIP
      https:
        port: 8443
      annotations: {}
    ingress:
      enabled: false
    ecpDirectoryProperties:
      # Pfade/Profile auch extern setzen; Values ersetzen keine Vollkonfiguration.
      springProfilesActive: 'ecp-nonha, console-logging'
      dataDirectory: /var/lib/ecp-directory
      loggingFilePath: /var/log/ecp-directory
      loggingFileName: /var/log/ecp-directory/ecp.log
      loggingConfig: /etc/ecp-directory/ecp-logback.xml
    envConf:
      resourcesJvm:
        xms: 64M
        xmx: 768M
      ecpLogFullStackTrace: false
