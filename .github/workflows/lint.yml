name: Validate Charts

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
    - 'charts/**'
    - '.github/**'
    - 'package.json'

permissions:
  contents: read

jobs:
  release-rules:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Test chart release rules
      run: npm run test:release

  standalone:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart: [ ecp-endpoint, ecp-directory, ecp-broker, eccosp-artemis ]
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    - name: Install pinned validation tools (verified downloads)
      run: |
        bash .github/scripts/setup-tools.sh
        python -m pip install --disable-pip-version-check PyYAML==6.0.2
    - name: Test CI fixture generator and manifest assertions
      run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
    - name: Lint, render, validate and test packaged chart
      run: python .github/scripts/validate_charts.py --chart '${{ matrix.chart }}'
    - name: Upload validated synthetic fixtures and package
      uses: actions/upload-artifact@v7
      with:
        name: ci-charts-${{ matrix.chart }}
        path: .ci-artifacts/${{ matrix.chart }}/publish/
        if-no-files-found: error
        retention-days: 14

  kubernetes-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    - name: Select supported Kubernetes node images
      id: select
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python .github/scripts/kubernetes_matrix.py >> "$GITHUB_OUTPUT"

  kubernetes:
    needs: [standalone, kubernetes-matrix]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.kubernetes-matrix.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        pattern: ci-charts-*
        path: .ci-artifacts/cluster
    - uses: helm/kind-action@v1.12.0
      with:
        version: ${{ matrix.kind_version }}
        node_image: ${{ matrix.node_image }}
        kubectl_version: v${{ matrix.kubernetes_version }}
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    - name: Install Helm 3.19.0 (verified download)
      run: |
        bash .github/scripts/setup-tools.sh helm-only
        python -m pip install --disable-pip-version-check PyYAML==6.0.2
    - name: Install verified Gateway API CRDs
      shell: bash
      run: |
        set -euo pipefail
        python -c 'import sys; sys.path.insert(0, ".github/scripts"); from gateway_schemas import download_source; sys.stdout.buffer.write(b"\n---\n".join(download_source(kind) for kind in ("HTTPRoute", "BackendTLSPolicy")))' |
          kubectl apply --server-side -f -
        kubectl wait --for=condition=Established --timeout=90s \
          crd/httproutes.gateway.networking.k8s.io \
          crd/backendtlspolicies.gateway.networking.k8s.io
    - name: Check packaged charts against the Kubernetes API
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        kubectl create namespace review-namespace
        for chart in ecp-endpoint ecp-directory ecp-broker eccosp-artemis; do
          directory=".ci-artifacts/cluster/ci-charts-${chart}"
          packages=("$directory"/"$chart"-*.tgz)
          test "${#packages[@]}" -eq 1
          for case in existing-secret ingress gateway-https gateway-http; do
            echo "Checking ${chart}/${case} with Kubernetes server-side dry-run"
            helm template review "${packages[0]}" \
              --namespace review-namespace \
              --values "$directory/${case}.values.yaml" |
              kubectl apply --dry-run=server --validate=strict \
                --namespace review-namespace -f -
          done
        done
