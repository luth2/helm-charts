name: Validate Charts (no cluster)

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
    - 'charts/**'
    - '.github/**'
    - 'package.json'

permissions:
  contents: read

jobs:
  release-rules:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Test chart release rules
      run: npm run test:release

  standalone:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart: [ ecp-endpoint, ecp-directory, ecp-broker, eccosp-artemis ]
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    - name: Install pinned validation tools (verified downloads)
      run: |
        bash .github/scripts/setup-tools.sh
        python -m pip install --disable-pip-version-check PyYAML==6.0.2
    - name: Test CI fixture generator and manifest assertions
      run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
    - name: Lint, render, validate and test packaged chart
      run: python .github/scripts/validate_charts.py --chart '${{ matrix.chart }}'
    - name: Upload validated synthetic fixtures and package
      uses: actions/upload-artifact@v7
      with:
        name: ci-charts-${{ matrix.chart }}
        path: .ci-artifacts/${{ matrix.chart }}/publish/
        if-no-files-found: error
        retention-days: 14
