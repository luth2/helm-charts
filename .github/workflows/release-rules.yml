name: Validate Chart Release Rules

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
    - '.github/release.config.cjs'
    - '.github/scripts/chart_release.cjs'
    - '.github/scripts/test_chart_release.cjs'
    - '.github/workflows/release-rules.yml'
    - 'package.json'

permissions:
  contents: read

jobs:
  release-rules:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: '22'
    - name: Test chart release rules
      run: npm run test:release
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    - name: Test chart version updates
      run: |
        python -m pip install --disable-pip-version-check PyYAML==6.0.2
        python -m unittest discover -s .github/scripts -p 'test_release_ci.py' -v