name: Validate Helm Charts on Kubernetes

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
    - 'charts/**'
    - '.github/scripts/chart_fixtures.py'
    - '.github/scripts/gateway_schemas.py'
    - '.github/scripts/kubernetes_fixtures.py'
    - '.github/scripts/kubernetes_matrix.py'
    - '.github/scripts/setup-tools.sh'
    - '.github/workflows/kubernetes.yml'

permissions:
  contents: read

jobs:
  kubernetes-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    - name: Test Kubernetes fixture and matrix selection
      run: |
        python -m pip install --disable-pip-version-check PyYAML==6.0.2
        python -m unittest discover -s .github/scripts -p 'test_kubernetes_ci.py' -v
    - name: Select supported Kubernetes node images
      id: select
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python .github/scripts/kubernetes_matrix.py >> "$GITHUB_OUTPUT"

  kubernetes:
    needs: kubernetes-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.kubernetes-matrix.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: helm/kind-action@v1.12.0
      with:
        version: ${{ matrix.kind_version }}
        node_image: ${{ matrix.node_image }}
        kubectl_version: v${{ matrix.kubernetes_version }}
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    - name: Install Helm and fixture dependencies
      run: |
        bash .github/scripts/setup-tools.sh helm-only
        python -m pip install --disable-pip-version-check PyYAML==6.0.2
    - name: Package charts and prepare synthetic fixtures
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/charts"
        for chart in ecp-endpoint ecp-directory ecp-broker eccosp-artemis; do
          helm package "charts/$chart" --destination "$RUNNER_TEMP/charts"
        done
        python .github/scripts/kubernetes_fixtures.py "$RUNNER_TEMP/fixtures"
    - name: Install verified Gateway API CRDs
      shell: bash
      run: |
        set -euo pipefail
        python -c 'import sys; sys.path.insert(0, ".github/scripts"); from gateway_schemas import download_source; sys.stdout.buffer.write(b"\n---\n".join(download_source(kind) for kind in ("HTTPRoute", "BackendTLSPolicy")))' |
          kubectl apply --server-side -f -
        kubectl wait --for=condition=Established --timeout=90s \
          crd/httproutes.gateway.networking.k8s.io \
          crd/backendtlspolicies.gateway.networking.k8s.io
    - name: Check packaged charts against the Kubernetes API
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        kubectl create namespace review-namespace
        for chart in ecp-endpoint ecp-directory ecp-broker eccosp-artemis; do
          packages=("$RUNNER_TEMP/charts/$chart"-*.tgz)
          test "${#packages[@]}" -eq 1
          for case in existing-secret ingress gateway-https gateway-http; do
            echo "Checking ${chart}/${case} with Kubernetes server-side dry-run"
            helm template review "${packages[0]}" \
              --namespace review-namespace \
              --values "$RUNNER_TEMP/fixtures/$chart/$case.yaml" |
              kubectl apply --dry-run=server --validate=strict \
                --namespace review-namespace -f -
          done
        done